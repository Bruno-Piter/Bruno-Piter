name: Atualizar progresso dos cursos

on:
  schedule:
    # 03:00 UTC = meia-noite em São Paulo
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recalcular porcentagem
        run: node scripts/update-course-progress.mjs

      - name: Publicar se a porcentagem mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visual-dark.svg assets/visual-light.svg README.md
          if git diff --staged --quiet; then
            echo "Progresso inalterado."
          else
            git commit -m "Atualiza o progresso do perfil"
            git push
          fi
